steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/dietmanagementapp-501307/cloud-run-source-deploy/diet-management-api:$COMMIT_SHA'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/dietmanagementapp-501307/cloud-run-source-deploy/diet-management-api:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'diet-management-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/dietmanagementapp-501307/cloud-run-source-deploy/diet-management-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-secrets=/secrets/firebase-adminsdk.json=firebase-adminsdk:latest'

images:
  - 'us-central1-docker.pkg.dev/dietmanagementapp-501307/cloud-run-source-deploy/diet-management-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY